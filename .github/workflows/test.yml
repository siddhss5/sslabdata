name: Test

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    name: test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ '3.10', '3.14' ]
    env:
      # Make uv use the matrix interpreter rather than any other on the runner.
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      with:
        version: "0.12.15"

    - name: Install sslabdata
      run: |
        uv sync --frozen --extra test

    # The floor matches [tool.coverage.report] fail_under in pyproject.toml.
    - name: Run tests with coverage
      run: |
        uv run --frozen pytest --cov=sslabdata --cov-branch --cov-report=term-missing --cov-fail-under=92

    - name: Validate demo lab
      run: |
        uv run --frozen sslabdata --config examples/demo/lab.yaml --validate

    - name: Validate demo lab under --strict
      run: |
        uv run --frozen sslabdata --config examples/demo/lab.yaml --validate --strict
