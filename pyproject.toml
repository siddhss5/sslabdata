[project]
name = "sslabdata"
version = "3.0.0"
description = "Renderer-agnostic academic lab data assembler: BibTeX + YAML → structured data"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Siddhartha Srinivasa"}]
keywords = ["bibtex", "bibliography", "publications", "academic", "research", "lab", "yaml", "json-schema"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Markup :: LaTeX",
]
dependencies = [
    "pybtex~=0.26",
    "pylatexenc~=2.11",
    "pyyaml"
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov",
    "jsonschema>=4"
]

[project.scripts]
sslabdata = "sslabdata.cli:main"

[project.urls]
Homepage = "https://github.com/siddhss5/sslabdata"
Repository = "https://github.com/siddhss5/sslabdata"
Documentation = "https://github.com/siddhss5/sslabdata/blob/main/SPEC.md"
Issues = "https://github.com/siddhss5/sslabdata/issues"
Changelog = "https://github.com/siddhss5/sslabdata/blob/main/CHANGELOG.md"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["sslabdata*"]

[tool.pytest.ini_options]
addopts = "--cov --cov-report=term-missing"

[tool.coverage.run]
source = ["sslabdata"]
branch = true

[tool.coverage.report]
fail_under = 92
precision = 2
