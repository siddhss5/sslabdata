[project]
name = "sslabdata"
version = "3.0.0"
description = "Renderer-agnostic academic lab data assembler: BibTeX + YAML → structured data"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Siddhartha Srinivasa"}]
keywords = ["bibtex", "bibliography", "publications", "academic", "research", "lab", "yaml", "json-schema"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Markup :: LaTeX",
]
dependencies = [
    "pybtex~=0.26",
    "pylatexenc~=2.11",
    "pyyaml"
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov",
    "jsonschema>=4",
    "setuptools>=77"
]

# Tools for development and CI only; not part of the published metadata.
[dependency-groups]
typecheck = [
    "mypy==2.3.1",
    "types-PyYAML==6.0.12.20260906",
]

[project.scripts]
sslabdata = "sslabdata.cli:main"

[project.urls]
Homepage = "https://github.com/siddhss5/sslabdata"
Repository = "https://github.com/siddhss5/sslabdata"
Documentation = "https://github.com/siddhss5/sslabdata/blob/main/SPEC.md"
Issues = "https://github.com/siddhss5/sslabdata/issues"
Changelog = "https://github.com/siddhss5/sslabdata/blob/main/CHANGELOG.md"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

# The current output schema and input schemas are public wheel data, installed
# at sslabdata/schema/v5/output.schema.json and
# sslabdata/schema/input/v1/*.schema.json. The package directory is mapped onto
# the repository's schema/ directory so each frozen file has one copy and one
# path; earlier versions stay in the sdist only. schema/__init__.py makes the
# mapped directory a regular package, which editable installs need to resolve.
[tool.setuptools]
include-package-data = false
packages = ["sslabdata", "sslabdata.parsers", "sslabdata.schema"]

[tool.setuptools.package-dir]
"sslabdata.schema" = "schema"

[tool.setuptools.package-data]
"sslabdata.schema" = ["v5/output.schema.json", "input/v1/*.schema.json"]

[tool.mypy]
files = ["sslabdata"]
check_untyped_defs = true

# Neither ships type hints or has a stub package.
[[tool.mypy.overrides]]
module = ["pybtex.*", "pylatexenc.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--cov --cov-report=term-missing"

[tool.coverage.run]
source = ["sslabdata"]
branch = true

[tool.coverage.report]
fail_under = 92
precision = 2
