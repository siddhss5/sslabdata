# Run-together initials (#81). Stella declares her initials spaced and is
# written run-together; Tobin declares them run-together and is written
# spaced; Uma has three. Each form is equal to the other once each initial
# is a part of its own.
# CASE names.initials_run_together
# CASE names.initials_run_together_unmatched
- id: "sivers"
  name: "Stella Sky Ivers"
  aliases: ["S. S. Ivers"]
  role: "phd_student"
  status: "current"

# CASE names.initials_run_together_alias
# CASE names.initials_multiletter_whole
- id: "tlark"
  name: "Tobin Rue Lark"
  aliases: ["T.R. Lark"]
  role: "phd_student"
  status: "current"

# CASE names.initials_run_together_three
- id: "umoss"
  name: "Uma Ann Kaye Moss"
  aliases: ["U. A. K. Moss"]
  role: "postdoc"
  status: "current"

# A two-letter given name. `E.D.` is two initials, not `Ed`, so a
