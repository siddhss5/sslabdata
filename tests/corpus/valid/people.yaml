# Fictional lab members for the conformance corpus (see tests/COVERAGE.md).

# CASE output.person.id
# CASE output.person.name
# CASE output.person.role
# CASE output.person.status
# CASE output.person.website
# CASE output.person.photo
# CASE output.person.email
# CASE output.person.start_year
# CASE output.person.work_ids
# CASE output.person.derived
# CASE identity.alias
- id: "aadams"
  name: "Alice Adams"
  aliases: ["A. Adams"]
  role: "professor"
  status: "current"
  photo: "images/aadams.jpg"
  website: "https://example.org/people/aadams"
  email: "aadams@example.org"
  start_year: 2015

# CASE output.person.co_advisor
# CASE output.person.bio
# CASE people.bio_line_breaks
# A literal block scalar: every line break is kept, the blank line and the
# final one included.
- id: "bbrown"
  name: "Bob Brown"
  aliases: ["B. Brown"]
  role: "phd_student"
  status: "current"
  co_advisor: "Peggy Park"
  start_year: 2021
  bio: |
    Bob Brown is a fictional PhD student.
    He studies shared control.

    He is advised by Alice Adams & Peggy Park.

# The same person written with TeX accents and in UTF-8 in names.bib.
# CASE people.bio_line_breaks
# A folded block scalar: YAML joins the first two lines with a space and
# keeps the blank line as one line break. `<b>` and `*` are text.
- id: "ccote"
  name: "Carol Côté"
  aliases: ["C. Côté"]
  role: "phd_student"
  status: "current"
  bio: >
    Carol Côté places objects
    in fictional kitchens.

    She writes <b>bold</b> and *stars* as text.

# CASE people.bio_line_breaks
# A double-quoted string: `\n` is a line break.
- id: "ddavis"
  name: "Dave Davis"
  aliases: ["D. Davis"]
  role: "ms_student"
  status: "current"
  bio: "Dave Davis is fictional.\nHe has two lines."

