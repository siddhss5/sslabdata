# Valid conformance corpus: a fictional lab. Every case here should assemble
# cleanly. See tests/COVERAGE.md for what each CASE marker means.
# Paths are relative to this directory; the tests run sslabdata from here.

# CASE config.lab.present
# CASE config.lab.missing
# CASE config.lab.date
# CASE output.lab
# CASE output.schema_version
# CASE output.generator
# CASE output.derived_is_empty
lab:
  name: "Corpus Lab"
  description: "A fictional lab used only by the sslabdata conformance tests."
  university: "Example University"
  website: "https://example.org/corpus"

# Read by downstream renderers, not by sslabdata, which accepts it.
# CASE config.site
site:
  url: "https://example.org"
  baseurl: "/corpus"

# CASE config.bib_dir.present
bib_dir: "."
# CASE config.bib_files.present
# CASE output.work.category
bib_files:
  - name: "strings.bib"
    category: "Strings"
  - name: "names.bib"
    category: "Names"
  - name: "latex.bib"
    category: "LaTeX"
  - name: "structure.bib"
    category: "Structure"
  - name: "encoding.bib"
    category: "Encoding"
  - name: "links.bib"
    category: "Links"
  - name: "projects.bib"
    category: "Projects"

# A local directory: a PDF link is emitted only when <key>.pdf exists here.
# CASE config.pdf_base_url.present
# CASE config.pdf_base_url.missing
# CASE links.pdf.remote_guess
pdf_base_url: "pdfs"
# CASE config.people_file.present
# CASE config.people_file.missing
people_file: "people.yaml"
# CASE config.projects_file.present
# CASE config.projects_file.missing
projects_file: "projects.yaml"

