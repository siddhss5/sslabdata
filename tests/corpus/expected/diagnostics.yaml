  diagnostics:
    - {code: PROJECTS-STATUS-INVALID, severity: warning, file: projects.yaml, key: sharedarm, field: status, values: [sometimes]}
  kept: [ok-entry]

# A key given twice in a record of each file: an error at the file, the record
# and the key, naming both lines, and the record is not loaded. The merge key
# in people.yaml is not a repeated key and is not reported (records.merge_key).
records.key_repeated:
  dir: record_key_repeated
  exit: 1
  fatal: assembly
  diagnostics:
    - {code: RECORD-KEY-REPEATED, severity: error, file: people.yaml, key: ann, field: name, values: [line 5, line 6]}
    - {code: RECORD-KEY-REPEATED, severity: error, file: projects.yaml, key: homebot, field: status, values: [line 5, line 6]}
    - {code: RECORD-KEY-REPEATED, severity: error, file: projects.yaml, field: id, values: [line 8, line 9]}
    - {code: RECORD-KEY-REPEATED, severity: error, file: collaborators.yaml, key: Priya Patel, field: aliases, values: [line 4, line 5]}

# One key in each file: a warning at the file, the record and the key, and no
# key reaches the document.
records.unknown_key:
  dir: record_unknown_key
  exit: 0
  diagnostics:
    - {code: RECORD-KEY-UNKNOWN, severity: warning, file: people.yaml, key: aadams, field: webiste}
    - {code: RECORD-KEY-UNKNOWN, severity: warning, file: projects.yaml, key: homebot, field: funding}
    - {code: RECORD-KEY-UNKNOWN, severity: warning, file: collaborators.yaml, key: Priya Patel, field: affiliation}
  not_emitted: [webiste, funding, affiliation]
  kept: [ok-entry]

# Each wrong-typed optional field is one located warning and a null in the
# document; a status that is not a string reads as the default, and aliases
# that are not a list of strings declare none. The record is kept.
records.optional_type_invalid:
  dir: record_field_types
  exit: 0
  diagnostics:
    - {code: RECORD-TYPE-INVALID, severity: warning, file: people.yaml, key: aadams, field: photo}
    - {code: RECORD-TYPE-INVALID, severity: warning, file: people.yaml, key: aadams, field: website}
    - {code: RECORD-TYPE-INVALID, severity: warning, file: people.yaml, key: aadams, field: start_year}
    - {code: RECORD-TYPE-INVALID, severity: warning, file: people.yaml, key: aadams, field: aliases}
    - {code: RECORD-TYPE-INVALID, severity: warning, file: people.yaml, key: bbrown, field: email}
    - {code: RECORD-TYPE-INVALID, severity: warning, file: people.yaml, key: bbrown, field: end_year}
    - {code: RECORD-TYPE-INVALID, severity: warning, file: people.yaml, key: bbrown, field: aliases}
    - {code: RECORD-TYPE-INVALID, severity: warning, file: projects.yaml, key: homebot, field: description}
    - {code: RECORD-TYPE-INVALID, severity: warning, file: projects.yaml, key: homebot, field: website}
    - {code: RECORD-TYPE-INVALID, severity: warning, file: projects.yaml, key: homebot, field: image}
    - {code: RECORD-TYPE-INVALID, severity: warning, file: collaborators.yaml, key: Priya Patel, field: aliases}
    - {code: PEOPLE-STATUS-INVALID, severity: warning, file: people.yaml, key: aadams, field: status}
    - {code: PROJECTS-STATUS-INVALID, severity: warning, file: projects.yaml, key: homebot, field: status}
  emits:
    - person: aadams
      expect: {status: current, role: professor, photo: null, website: null, start_year: null}
    - person: bbrown
      expect: {email: null, end_year: null}
    - project: homebot
      expect: {status: active, description: null, website: null, image: null}
  kept: [ok-entry]

# An `id`, `name` or `title` is never coerced: a number, a list or a boolean
# makes the record unusable, one located error per file.
records.required_type_invalid:
  dir: record_id_types
  exit: 1
  fatal: assembly
  diagnostics:
