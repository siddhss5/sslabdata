identity.ambiguous_alias:
  dir: ambiguous_alias
  exit: 0
  diagnostics:
    - {code: PEOPLE-ALIAS-AMBIGUOUS, severity: warning, file: people.yaml, key: bbrowning, field: aliases, values: [bbrown, bbrowning, B. Brown]}
    - {code: RESOLVE-AMBIGUOUS-NAME, severity: warning, file: ./brown.bib, key: brown-initial, field: author, values: [bbrown, bbrowning]}
  kept: [brown-initial]
  emits:
    - work: brown-initial
      expect: {authors.0.person_id: null, authors.0.resolution.status: ambiguous}
  unresolved_only:
    - {code: RESOLVE-UNRESOLVED-NAME, severity: warning, file: ./brown.bib, key: brown-initial, field: author, values: [B. Brown]}

