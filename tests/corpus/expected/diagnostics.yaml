    - {code: PEOPLE-FIELD-MISSING, severity: error, file: people.yaml, key: bbrown, field: name}
    - {code: PROJECTS-FIELD-MISSING, severity: error, file: projects.yaml, field: id}
    - {code: COLLABORATORS-FIELD-MISSING, severity: error, file: collaborators.yaml, field: name}

