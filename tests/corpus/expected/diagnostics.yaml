# The expected outcome of each case in tests/corpus/invalid/<dir>/, one entry
# per fixture. test_invalid_corpus.py runs each fixture once per mode
# (`--validate`, `--unresolved`, `--output`) and once through the Python API,
# and compares everything a user can observe with the entry.
#
#   dir          the fixture folder; its lab.yaml is the configuration.
#   exit         the exit status of `--validate`, 0 or 1. Under `--unresolved`
#                and `--output` it is 1 only for a fatal case.
#   fatal        load: the configuration does not load, so `assemble()` is never
#                reached. assembly: it loads and assembly finds a fatal code.
#                Absent: nothing is fatal, and a document is written.
#   diagnostics  the records `--validate --format json` reports, every one of
#                them, each exactly once: code, severity, and where (file, key,
#                field; omitted when null). `--unresolved` and the standard
#                error of `--output` report the same records, as warnings
#                unless the case is fatal. CONFIG-LAB-NAME-MISSING is left out:
#                these fixtures declare no lab name, and test_config_cli.py owns
#                it. `values` are tokens the message must carry: the value that
#                is wrong, never the wording around it.
#   unresolved_only
#                records `--unresolved` adds to those: the names it lists.
#   kept         every bib key in the exported document, exactly and each as often as
#                it is exported; a fatal case writes no document.
#   emits        what the exported document holds for a work, person or project
#                (by bib key or id): a value, or contains/excludes for text.
#   not_emitted  tokens the exported document must not contain.
#
# A `key` that YAML would read as a number or a date is quoted.

# --- BibTeX structure ---------------------------------------------------------

# The entry whose brace never closes also loses its venue and year, and each
# of those is its own record on the same file and key.
structure.unclosed_brace:
  dir: unclosed_brace
  exit: 0
  diagnostics:
    - {code: BIB-SYNTAX-ERROR, severity: warning, file: ./broken.bib, key: brace-broken, field: title}
    - {code: BIB-VENUE-MISSING, severity: warning, file: ./broken.bib, key: brace-broken, field: journal}
    - {code: BIB-YEAR-MISSING, severity: warning, file: ./broken.bib, key: brace-broken, field: year}
  kept: [brace-before, brace-broken, brace-after]

structure.duplicate_key_file:
  dir: duplicate_key_same_file
  exit: 1
  diagnostics:
    - {code: BIB-DUPLICATE-KEY, severity: error, file: ./dup.bib, key: dup-key, field: citation_key}
  kept: [dup-key]

structure.duplicate_key_across:
  dir: duplicate_key_across_files
  exit: 1
  diagnostics:
    - {code: BIB-DUPLICATE-KEY, severity: error, file: ./second.bib, key: shared-key, field: citation_key, values: [./first.bib]}
  kept: [shared-key, shared-key]

structure.missing_year:
  dir: missing_year
  exit: 0
  diagnostics:
    - {code: BIB-YEAR-MISSING, severity: warning, file: ./noyear.bib, key: no-year, field: year}
  kept: [no-year]

structure.crossref:
  dir: crossref_entry
  exit: 1
  fatal: assembly
  diagnostics:
    - {code: BIB-CROSSREF-UNSUPPORTED, severity: error, file: ./crossref.bib, key: child2024, field: crossref, values: [proc2024]}

structure.crossref_undefined_parent:
  dir: crossref_undefined_parent
  exit: 1
  fatal: assembly
  diagnostics:
    - {code: BIB-CROSSREF-UNSUPPORTED, severity: error, file: ./crossref.bib, key: orphan-child, field: crossref, values: [no-such-parent]}

# The field is rejected on its presence, not on its value, so an empty one
# and a whitespace-only one are the same error as any other.
structure.crossref_no_parent:
  dir: crossref_no_parent
  exit: 1
  fatal: assembly
  diagnostics:
    - {code: BIB-CROSSREF-UNSUPPORTED, severity: error, file: ./crossref.bib, key: empty-crossref, field: crossref}
    - {code: BIB-CROSSREF-UNSUPPORTED, severity: error, file: ./crossref.bib, key: blank-crossref, field: crossref}

structure.year_not_number:
  dir: year_not_number
  exit: 0
  diagnostics:
    - {code: BIB-YEAR-INVALID, severity: warning, file: ./badyear.bib, key: bad-year, field: year, values: [in press]}
  kept: [bad-year, ok-entry]

# A year is an unsigned run of ASCII digits; int() would read each of these
# four as a number.
structure.year_not_digits:
  dir: year_not_digits
  exit: 0
  diagnostics:
    - {code: BIB-YEAR-INVALID, severity: warning, file: ./digits.bib, key: year-negative, field: year, values: ["-5"]}
    - {code: BIB-YEAR-INVALID, severity: warning, file: ./digits.bib, key: year-plus, field: year, values: ["+2020"]}
    - {code: BIB-YEAR-INVALID, severity: warning, file: ./digits.bib, key: year-underscore, field: year, values: ["2_020"]}
    - {code: BIB-YEAR-INVALID, severity: warning, file: ./digits.bib, key: year-fullwidth, field: year, values: [２０２０]}
  kept: [year-digits, year-negative, year-plus, year-underscore, year-fullwidth]
  emits:
    - work: year-negative
      expect: {year: null}
    - work: year-plus
      expect: {year: null}
    - work: year-underscore
      expect: {year: null}
    - work: year-fullwidth
      expect: {year: null}
    - work: year-digits
      expect: {year: 2020}

structure.missing_journal:
  dir: missing_journal
  exit: 0
  diagnostics:
    - {code: BIB-VENUE-MISSING, severity: warning, file: ./nojournal.bib, key: no-journal, field: journal}
  kept: [no-journal]

structure.missing_booktitle:
  dir: missing_booktitle
  exit: 0
  diagnostics:
    - {code: BIB-VENUE-MISSING, severity: warning, file: ./nobooktitle.bib, key: no-booktitle, field: booktitle}
  kept: [no-booktitle]

# The macro is read as empty, so the entry has no booktitle either.
strings.undefined:
  dir: undefined_string
  exit: 0
  diagnostics:
    - {code: BIB-STRING-UNDEFINED, severity: warning, file: ./macro.bib, key: undefined-macro, field: booktitle, values: [nosuchmacro]}
    - {code: BIB-VENUE-MISSING, severity: warning, file: ./macro.bib, key: undefined-macro, field: booktitle}
  kept: [undefined-macro, ok-entry]

types.unsupported:
  dir: unsupported_entry_type
  exit: 0
  diagnostics:
    - {code: BIB-ENTRY-TYPE-UNSUPPORTED, severity: warning, file: ./entry.bib, key: draft-note, field: entry_type, values: [unpublished]}
  kept: [draft-note]

latex.unknown_macro:
  dir: unknown_macro
  exit: 0
  diagnostics:
    - {code: LATEX-COMMAND-UNKNOWN, severity: warning, file: ./macro.bib, key: unknown-macro, field: title, values: ["\\fictionalmacro"]}
  kept: [unknown-macro]
  emits:
    - work: unknown-macro
      expect: {title: {contains: [Strange], excludes: ["\\"]}}

# One record for the command, however many fields use it, with the count and
# the first field in document order.
latex.unknown_macro_repeated:
  dir: unknown_macro_repeated
  exit: 0
  diagnostics:
    - {code: LATEX-COMMAND-UNKNOWN, severity: warning, file: ./macro.bib, key: first-use, field: title, values: ["\\fictionalmacro", 3 fields]}
  kept: [first-use, second-use]

# Valid input kept here as a regression case: it reports nothing, and the
# valid corpus stays unchanged.
latex.text_macros:
  dir: common_text_macros
  exit: 0
  diagnostics: []
  kept: [text-macros]
  emits:
    - work: text-macros
      expect:
        title: "The TeX book 1990—2000"
        note: "Typeset with LaTeX and BibTeX, pages 1–2, read/write"

# The first byte that is not UTF-8 is on line 6 of latin1.bib.
structure.not_utf8:
  dir: bib_not_utf8
  exit: 1
  fatal: assembly
  diagnostics:
    - {code: BIB-ENCODING-INVALID, severity: error, file: ./latin1.bib, values: ["0xfc", line 6]}

# A resolver with nothing after it names no DOI: no identifier, no link.
links.doi_resolver_only:
  dir: doi_resolver_only
  exit: 0
  diagnostics:
    - {code: BIB-DOI-INVALID, severity: warning, file: ./doi.bib, key: doi-resolver-only, field: doi, values: ["https://doi.org/"]}
    - {code: BIB-DOI-INVALID, severity: warning, file: ./doi.bib, key: doi-dx-resolver-only, field: doi, values: ["http://dx.doi.org/"]}
  kept: [doi-resolver-only, doi-dx-resolver-only, doi-present]
  emits:
    - work: doi-resolver-only
      expect: {identifiers: {}, links: {}}
    - work: doi-dx-resolver-only
      expect: {identifiers: {}, links: {}}
    - work: doi-present
      expect: {identifiers.doi: [10.5555/corpus.0003], links.doi.0.url: "https://doi.org/10.5555/corpus.0003"}

# --- Projects, people and identity -------------------------------------------

# "and others" before the end of a name list is reported and dropped; at the
# end it is "et al.", as ever, and says nothing.
names.others_mid_list:
  dir: others_mid_list
  exit: 0
  diagnostics:
    - {code: BIB-OTHERS-NOT-LAST, severity: warning, file: ./others.bib, key: others-mid-author, field: author}
    - {code: BIB-OTHERS-NOT-LAST, severity: warning, file: ./others.bib, key: others-mid-editor, field: editor}
  unresolved_only:
    - {code: RESOLVE-UNRESOLVED-NAME, severity: warning, file: ./others.bib, key: others-mid-author, field: author, values: [Bob Brown]}
    - {code: RESOLVE-UNRESOLVED-NAME, severity: warning, file: ./others.bib, key: others-mid-author, field: author, values: [Cy Cee]}
  kept: [others-mid-author, others-mid-editor, others-last]
  emits:
    - work: others-mid-author
      expect: {authors.*.name: [Alice Adams, Bob Brown, Cy Cee], authors.*.position: [1, 2, 3]}
    - work: others-mid-editor
      expect: {editors.*.name: [Bob Brown], editors.*.position: [1]}
    - work: others-last
      expect: {authors.*.name: [Alice Adams, Bob Brown]}

projects.undefined:
  dir: undefined_project
  exit: 1
  diagnostics:
    - {code: RESOLVE-PROJECT-UNKNOWN, severity: error, file: ./tagged.bib, key: proj-undefined, field: project, values: [nosuchproject]}
